<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Stream Ending</title>
<link rel="stylesheet" href="overlay.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body class="scene">
  <div class="grid-bg"></div>
  <header class="topbar">
    <div class="event"><span class="event-slash"></span><span class="event-name" data-bind="event">Your Event</span></div>
    <div class="meta"><span data-bind="game">Rocket League</span><span class="sep"></span><span data-date></span><span class="sep"></span><span data-clock>00:00</span></div>
  </header>
  <main class="hero">
    <h1 class="rise d1">GG, thanks<br>for <span class="hl">watching</span></h1>
  </main>
  <section class="tiles rise d3" data-social-tiles>
    <div class="tile feature"><div class="label">See you</div><div class="value" style="font-size:34px;white-space:normal" data-bind="nextStream">Next stream soon</div></div>
  </section>
</body>
</html>
