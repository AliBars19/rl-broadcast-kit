<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Program: Starting Soon</title>
<link rel="stylesheet" href="program.css">
<script src="../config.js"></script>
<script src="../common.js"></script>
<script src="program.js"></script>
<style>
  /* Starting Soon: plain text lines only (no slabs, plates or boxes) */
  .evline {
    display: flex; align-items: center; justify-content: center; gap: 20px; margin-top: 16px;
    font-family: var(--font-display); font-weight: 600; font-size: 26px; line-height: 1; color: var(--ice);
    white-space: nowrap;
  }
  .evline .sep { display: block; width: 3px; height: 26px; background: var(--gold); }
  .evline .stg { color: var(--gold); font-weight: 700; }
  .evline[data-nostage] .stg, .evline[data-nostage] .sep.last { display: none; }

  .startlabel {
    position: absolute; left: 0; right: 0; top: 330px; text-align: center;
    font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1; color: var(--gold);
  }
  .startlabel span { display: inline-block; transform: skewX(-8deg); }
  .clockbox { position: absolute; left: 0; right: 0; top: 352px; height: 420px; display: flex; align-items: center; justify-content: center; }

  .presented { font-family: var(--font-display); font-weight: 600; font-size: 20px; }

  /* FIRST UP: gold caption, then one centred line, a team-coloured bar beside each name */
  .firstup { position: absolute; left: 0; right: 0; top: 758px; text-align: center; }
  .firstup[hidden] { display: none; }
  .fu-cap { font-family: var(--font-display); font-weight: 700; font-size: 22px; line-height: 1; color: var(--gold); }
  .fu-line {
    display: flex; align-items: center; justify-content: center; gap: 30px; margin-top: 14px;
    font-family: var(--font-display); font-weight: 700; line-height: 1; color: var(--white);
    transform: skewX(-8deg);
  }
  .fu-line .n { flex: none; width: 640px; display: flex; font-size: 40px; white-space: nowrap; }
  .fu-line .n.b { justify-content: flex-end; }
  .fu-line .n.o { justify-content: flex-start; }
  .fu-line .n > span { display: inline-block; }
  .fu-line .n.b > span { padding-left: 16px; border-left: 6px solid var(--blue); }
  .fu-line .n.o > span { padding-right: 16px; border-right: 6px solid var(--orange); }
  .fu-line .v { flex: none; font-size: 22px; font-weight: 600; color: var(--mute); }
</style>
</head>
<body>
<div class="stage">
  <iframe class="bg-frame in-fade" src="bg.html" title="" tabindex="-1"></iframe>

  <div class="head">
    <div class="wordmark in" style="--d:.15s" id="wordmark"></div>
    <div class="evline in" style="--d:.3s" id="evline"></div>
    <div class="presented in" style="--d:.45s"><span>PRESENTED BY</span><img id="sponsor" alt="" src=""></div>
  </div>

  <div class="startlabel in" style="--d:.55s"><span>STREAM STARTS IN</span></div>
  <div class="clockbox in" style="--d:.65s"><div class="clock solid" id="clock"></div></div>

  <div class="firstup in" style="--d:.9s" id="firstup" hidden>
    <div class="fu-cap">FIRST UP</div>
    <div class="fu-line"><div class="n b" id="fuB"><span></span></div><div class="v">VS</div><div class="n o" id="fuO"><span></span></div></div>
  </div>

  <div class="reel in" style="--d:1.1s" id="reel"></div>
  <div class="progress"><i id="bar"></i></div>
</div>

<script>
(function () {
  var S = PROG.S, DEF = PROG.DEF;
  var $ = function (id) { return document.getElementById(id); };
  var clockBox = $("clock"), clock = PROG.makeClock(clockBox);
  var state = null;  // last good state is kept while the feed is down

  // "YOUR LEAGUE | ROCKET LEAGUE" + gold bar + stage (gold), all on one plain line.
  function buildEventLine(node, text) {
    String(text).split("|").forEach(function (part, i) {
      if (i) node.appendChild(PROG.el("i", "sep"));
      node.appendChild(PROG.el("span", "", part.trim()));
    });
    node.appendChild(PROG.el("i", "sep last"));
    node.appendChild(PROG.el("span", "stg"));
  }

  PROG.fillWordmark($("wordmark"));
  buildEventLine($("evline"), DEF.eventSub || "YOUR LEAGUE | ROCKET LEAGUE");
  PROG.fillSponsor($("sponsor"));
  PROG.makeReel($("reel"), S.promos, 8000);

  // ---- countdown target (starting mode) ----
  var minutes = parseFloat(OV.param("min")) || DEF.minutes || S.startingMinutes || 5;
  var fallbackEnd = Date.now() + minutes * 60000;
  var target = fallbackEnd, total = minutes * 60000, targetSrc = "fallback";
  var done = false;

  function wantedTarget() {
    var p = state && state.program;
    if (p && typeof p.endsAt === "number" && isFinite(p.endsAt)) return { t: p.endsAt, src: "server" };
    return { t: fallbackEnd, src: "fallback" };
  }
  function retarget() {
    var w = wantedTarget();
    if (w.t === target && w.src === targetSrc) return;
    target = w.t; targetSrc = w.src;
    total = w.src === "fallback" ? minutes * 60000 : Math.max(1000, w.t - Date.now());
    if (done && w.t > Date.now()) showClock();
  }
  function showClock() {
    done = false;
    clockBox.className = "clock solid";
    clockBox.textContent = "";
    clock = PROG.makeClock(clockBox);
  }
  function showDone() {
    if (done) return;
    done = true;
    clockBox.className = "final solid";
    clockBox.textContent = "STARTING NOW";
  }
  function setBar(f) {
    $("bar").style.transform = "scaleX(" + Math.min(1, Math.max(0, f)).toFixed(4) + ")";
  }
  function tick() {
    var left = target - Date.now();
    if (left <= 0) { showDone(); setBar(1); return; }
    if (done) showClock();
    clock.set(PROG.mmss(Math.ceil(left / 1000)));
    setBar(1 - left / total);
  }

  // ---- first up strip (starting mode): only shown when the helper sent names ----
  function renderFirstUp() {
    var fu = (state && state.program && state.program.firstUp) || {};
    var b = (fu.blue || "").trim().toUpperCase(), o = (fu.orange || "").trim().toUpperCase();
    $("firstup").hidden = !(b && o);
    if (!(b && o)) return;
    [["fuB", b], ["fuO", o]].forEach(function (x) {
      var box = $(x[0]), span = box.firstChild;
      span.textContent = x[1];
      PROG.fit(box, span, 40, 20);
    });
  }

  function render() {
    var stage = PROG.stageOf(state).toUpperCase();
    var line = $("evline");
    PROG.setText(line.querySelector(".stg"), stage);
    if (stage) line.removeAttribute("data-nostage"); else line.setAttribute("data-nostage", "");
    renderFirstUp();
  }
  function onState(st) {
    if (st) state = st;
    retarget();
    render();
  }

  render();
  tick();
  setInterval(tick, 200);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(render);
  PROG.connect(onState);
  PROG.finishEntrances(3600);
})();
</script>
</body>
</html>
