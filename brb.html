<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Be Right Back</title>
<link rel="stylesheet" href="overlay.css">
<script src="config.js"></script>
<script src="common.js"></script>
</head>
<body class="scene">
  <div class="grid-bg"></div>
  <header class="topbar">
    <div class="event"><span class="event-slash"></span><span class="event-name" data-bind="event">Your Event</span></div>
    <div class="meta"><span data-bind="game">Rocket League</span><span class="sep"></span><span data-date></span><span class="sep"></span><span data-clock>00:00</span></div>
  </header>
  <main class="hero">
    <h1 class="rise d1">Be right<br><span class="hl">back</span></h1>
    <div class="loader rise d2"></div>
  </main>
  <section class="tiles rise d3" data-social-tiles>
    <div class="tile feature"><div class="label">Away for</div><div class="value" id="away">00:00</div></div>
  </section>
<script>
  (function () {
    var start = Date.now(), el = document.getElementById("away");
    setInterval(function () {
      var s = Math.floor((Date.now() - start) / 1000);
      el.textContent = OV.pad(Math.floor(s / 60)) + ":" + OV.pad(s % 60);
    }, 1000);
  })();
</script>
</body>
</html>
