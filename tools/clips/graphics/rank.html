<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>rank card</title>
<link rel="stylesheet" href="{{base}}short.css"></head>
<body>
  <div class="tag centered" style="top:240px">{{title}}</div>
  <div class="abs center heading amber" style="top:330px; font-size:760px; line-height:0.95; height:720px">{{rank}}</div>
  <div class="rule centered" style="top:1100px"></div>
  <div class="abs center heading white" style="top:1160px; font-size:{{player_size}}px">{{player}}</div>
  <div class="abs center mono blue" style="top:1308px; font-size:{{team_size}}px">{{team}}</div>
  <div class="abs center heading amber" style="top:1420px; font-size:{{caption_size}}px">{{caption}}</div>
  <div class="progress centered" style="top:1600px">{{raw:progress}}</div>
</body></html>
