  <div class="abs heading white" style="left:330px; width:690px; top:1300px; font-size:{{player_size}}px">{{player}}</div>
  <div class="abs mono blue" style="left:330px; width:690px; top:1420px; font-size:{{team_size}}px">{{team}}</div>
  <div class="abs mono dim" style="left:330px; width:690px; top:1476px; font-size:{{detail_size}}px; font-weight:400">{{detail}}</div>
  <div class="caption-bar" style="top:1580px; font-size:{{caption_size}}px">{{caption}}</div>
  <div class="progress" style="top:1700px">{{raw:progress}}</div>
