<!-- bottom block 1588..1848: rank glyph about 1607..1740, text column 1598..1752, caption bar 1772..1836 -->
  <div class="progress compact">{{raw:progress}}</div>
  <div class="heading amber" style="position:absolute; left:40px; top:1580px; width:190px; font-size:190px; line-height:1; text-align:center">{{rank}}</div>
  <div class="abs heading white" style="left:250px; width:770px; top:1598px; font-size:{{player_size}}px">{{player}}</div>
  <div class="abs mono blue" style="left:250px; width:770px; top:1684px; font-size:{{team_size}}px">{{team}}</div>
  <div class="abs mono dim" style="left:250px; width:770px; top:1722px; font-size:{{detail_size}}px; font-weight:400">{{detail}}</div>
  <div class="caption-bar" style="top:1772px; height:64px; font-size:{{caption_size}}px">{{caption}}</div>
